# Render Blueprint — CashGo backend (free tier)
# Deploy: Render dashboard → New → Blueprint → point at this repo.
services:
  - type: web
    name: cashgo-api
    runtime: python
    plan: free
    rootDir: backend
    pythonVersion: "3.12"
    buildCommand: pip install -r requirements.txt
    # Migrations run at startup — the free Postgres may not be reachable
    # during the build phase, and free tier has no shell access.
    startCommand: >
      python -m scripts.migrate &&
      ( [ "$SEED_DEMO" = "true" ] && python -m scripts.seed || true ) &&
      gunicorn app.main:app
      -k uvicorn.workers.UvicornWorker
      --workers 2
      --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cashgo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: FX_API_URL
        value: https://open.er-api.com/v6/latest
      - key: SEED_DEMO
        value: "true"   # delete this env var after first deploy

databases:
  - name: cashgo-db
    plan: free
    postgresMajorVersion: "16"

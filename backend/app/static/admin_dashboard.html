<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CashGo Admin</title>
<style>
  * { box-sizing: border-box; font-family: system-ui, sans-serif; }
  body { margin: 0; background: #f1f5f2; color: #1f2937; }
  header { background: #14532d; color: #fff; padding: 16px 24px; display: flex;
           justify-content: space-between; align-items: center; }
  header strong { font-size: 18px; }
  nav { background: #14532d; padding: 0 24px; display: flex; gap: 4px; }
  nav button { background: transparent; color: #bbf7d0; border: 0; padding: 10px 16px;
               cursor: pointer; font-size: 14px; border-bottom: 3px solid transparent; }
  nav button.active { color: #fff; border-bottom-color: #4ade80; }
  main { max-width: 1000px; margin: 28px auto; padding: 0 20px; }
  h3 { margin: 0 0 14px; font-size: 15px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr));
           gap: 14px; }
  .card { background: #fff; border-radius: 12px; padding: 18px 20px;
          box-shadow: 0 1px 3px rgba(0,0,0,.07); }
  .card h3 { font-size: 12px; color: #6b7280; font-weight: 600;
             text-transform: uppercase; letter-spacing: .4px; }
  .card .num { font-size: 28px; font-weight: 700; }
  .card .sub { font-size: 12px; color: #9ca3af; margin-top: 4px; }
  section { background: #fff; border-radius: 12px; padding: 22px 24px;
            box-shadow: 0 1px 3px rgba(0,0,0,.07); }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; padding: 10px 8px; color: #6b7280; font-weight: 600;
       font-size: 12px; text-transform: uppercase; letter-spacing: .3px;
       border-bottom: 2px solid #e5e7eb; }
  td { padding: 10px 8px; border-bottom: 1px solid #f3f4f6; }
  label { display: block; font-size: 12px; color: #6b7280; margin-bottom: 4px; }
  input, select { width: 100%; padding: 9px 10px; border: 1px solid #d1d5db;
                  border-radius: 8px; font-size: 14px; }
  input:focus { outline: 2px solid #15803d33; border-color: #15803d; }
  header input { width: 200px; }
  button { background: #15803d; color: #fff; border: 0; border-radius: 8px;
           padding: 10px 18px; cursor: pointer; font-size: 14px; }
  button.ghost { background: #f3f4f6; color: #374151; }
  button.danger { background: #fee2e2; color: #b91c1c; padding: 6px 12px;
                  font-size: 12px; border-radius: 6px; }
  .form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;
               margin: 14px 0 18px; }
  @media (max-width: 700px) { .form-grid { grid-template-columns: 1fr 1fr; } }
  .badge { padding: 3px 10px; border-radius: 12px; font-size: 11.5px;
           font-weight: 600; white-space: nowrap; }
  .READY_FOR_PICKUP { background: #fef3c7; color: #92400e; }
  .COMPLETED { background: #d1fae5; color: #065f46; }
  .CANCELLED, .FAILED { background: #fee2e2; color: #991b1b; }
  .PENDING { background: #e0e7ff; color: #3730a3; }
  .inactive { opacity: .4; }
  .mono { font-family: ui-monospace, monospace; }
  #err { color: #b91c1c; padding: 8px 0; display: none; font-size: 13px;
         max-width: 1000px; margin: 0 auto; }
  .muted { color: #9ca3af; font-size: 12px; }
  .row-end { display: flex; justify-content: space-between; align-items: center; }
</style>
</head>
<body>
<header>
  <strong>CashGo Admin</strong>
  <span style="display:flex;gap:8px;align-items:center">
    <input id="key" type="password" placeholder="X-Admin-Key">
    <button onclick="saveKey()">Connect</button>
  </span>
</header>
<nav>
  <button id="nav-overview" class="active" onclick="tab('overview')">Overview</button>
  <button id="nav-fees" onclick="tab('fees')">Fee Tiers</button>
  <button id="nav-txns" onclick="tab('txns')">Transactions</button>
</nav>
<div id="err"></div>
<main>
  <!-- Overview -->
  <div id="pane-overview">
    <div class="cards" id="stats"></div>
    <p class="muted" style="margin-top:20px">
      Agent booth ops live at <a href="/agent/dashboard/">/agent/dashboard/</a>.
      Fee changes apply to new quotes instantly — no deploy needed.
    </p>
  </div>

  <!-- Fee tiers -->
  <div id="pane-fees" style="display:none">
    <section>
      <h3>Add corridor tier</h3>
      <div class="form-grid">
        <div><label>Source country</label><input id="f_src" placeholder="ZA"></div>
        <div><label>Destination</label><input id="f_dst" placeholder="ZW"></div>
        <div><label>Send currency</label><input id="f_sc" placeholder="ZAR"></div>
        <div><label>Payout currency</label><input id="f_pc" placeholder="ZWG"></div>
        <div><label>Min amount</label><input id="f_min" type="number" placeholder="0"></div>
        <div><label>Max amount</label><input id="f_max" type="number" placeholder="5000"></div>
        <div><label>Flat fee</label><input id="f_flat" type="number" step="0.01" placeholder="10.00"></div>
        <div><label>Percent fee (0.01 = 1%)</label><input id="f_pct" type="number" step="0.0001" placeholder="0.01"></div>
        <div><label>FX markup (0.008 = 0.8%)</label><input id="f_mk" type="number" step="0.0001" placeholder="0.008"></div>
      </div>
      <button onclick="createFee()">+ Add tier</button>
    </section>
    <section style="margin-top:20px">
      <div class="row-end"><h3>Active & historical tiers</h3>
        <button class="ghost" onclick="loadFees()">↻</button></div>
      <table id="fees"><thead><tr>
        <th>Corridor</th><th>Tier range</th><th>Flat</th><th>%</th><th>Markup</th><th>Active</th><th></th>
      </tr></thead><tbody></tbody></table>
    </section>
  </div>

  <!-- Transactions -->
  <div id="pane-txns" style="display:none">
    <section>
      <div class="row-end"><h3>Recent transactions</h3>
        <button class="ghost" onclick="loadTxns()">↻ Refresh</button></div>
      <table id="txns"><thead><tr>
        <th>Voucher</th><th>Status</th><th>Send</th><th>Fee</th><th>Payout</th><th>Recipient</th><th>Created</th>
      </tr></thead><tbody></tbody></table>
    </section>
  </div>
</main>
<script>
const API = '/api/v1/admin';
let KEY = localStorage.getItem('admin_key') || '';
if (KEY) document.getElementById('key').value = KEY;

const LOADERS = { overview: loadStats, fees: loadFees, txns: loadTxns };

function tab(t) {
  for (const k of ['overview','fees','txns']) {
    document.getElementById('pane-'+k).style.display = k===t ? '' : 'none';
    document.getElementById('nav-'+k).className = k===t ? 'active' : '';
  }
  if (KEY) LOADERS[t]();
}

function saveKey() {
  KEY = document.getElementById('key').value.trim();
  localStorage.setItem('admin_key', KEY);
  LOADERS[currentTab()]();
}
function currentTab() {
  return ['overview','fees','txns'].find(k =>
    document.getElementById('nav-'+k).className === 'active');
}

async function req(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'X-Admin-Key': KEY },
  });
  if (res.status === 403) { err('Invalid admin key'); throw new Error('403'); }
  if (!res.ok) { err('HTTP ' + res.status + ': ' + await res.text()); throw new Error(res.status); }
  return res.status === 204 ? null : res.json();
}

function err(m) {
  const e = document.getElementById('err');
  e.textContent = m; e.style.display = 'block';
  setTimeout(() => e.style.display = 'none', 6000);
}

async function loadStats() {
  const s = await req('/stats/');
  document.getElementById('stats').innerHTML = [
    ['Users', s.users], ['Transactions', s.transactions],
    ...Object.entries(s.by_status).map(([k, v]) => [k.replaceAll('_',' '), v]),
  ].map(([l, v]) => `<div class="card"><h3>${l}</h3><div class="num">${v}</div></div>`).join('');
}

async function loadFees() {
  const fees = await req('/fees/');
  document.querySelector('#fees tbody').innerHTML = fees.map(f => `
    <tr class="${f.is_active ? '' : 'inactive'}">
      <td><b>${f.source_country} → ${f.dest_country}</b> <span class="mono">${f.send_currency}/${f.payout_currency}</span></td>
      <td>${f.min_amount} – ${f.max_amount}</td>
      <td>${f.flat_fee}</td><td>${(f.percent_fee*100).toFixed(2)}%</td>
      <td>${(f.fx_margin_markup*100).toFixed(2)}%</td>
      <td>${f.is_active ? '✓' : '✗'}</td>
      <td>${f.is_active ? `<button class="danger" onclick="deactivate('${f.id}')">Deactivate</button>` : ''}</td>
    </tr>`).join('');
}

async function loadTxns() {
  const txns = await req('/transactions/');
  document.querySelector('#txns tbody').innerHTML = txns.map(t => `
    <tr><td><b class="mono">${t.voucher}</b></td>
      <td><span class="badge ${t.status}">${t.status.replaceAll('_',' ')}</span></td>
      <td>${t.send}</td><td>${t.fee}</td><td>${t.payout}</td>
      <td>${t.recipient}</td><td>${new Date(t.created_at).toLocaleString()}</td>
    </tr>`).join('');
}

async function loadAll() { loadStats(); loadFees(); loadTxns(); }

async function createFee() {
  await req('/fees/', { method: 'POST', body: JSON.stringify({
    source_country: f_src.value, dest_country: f_dst.value,
    send_currency: f_sc.value, payout_currency: f_pc.value,
    min_amount: +f_min.value, max_amount: +f_max.value,
    flat_fee: +f_flat.value, percent_fee: +f_pct.value,
    fx_margin_markup: +f_mk.value, is_active: true,
  })});
  loadFees(); loadStats();
}

async function deactivate(id) {
  await req('/fees/' + id, { method: 'DELETE' });
  loadFees();
}

if (KEY) loadAll();
</script>
</body>
</html>
